services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atelierpro}
      POSTGRES_USER: ${POSTGRES_USER:-atelierpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}
      # Encodage UTF-8 obligatoire (accents, flèches dans les messages)
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - atelierpro-db:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atelierpro} -d ${POSTGRES_DB:-atelierpro}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-atelierpro}:${POSTGRES_PASSWORD:?Définissez POSTGRES_PASSWORD dans .env}@db:5432/${POSTGRES_DB:-atelierpro}?schema=public
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:4000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      WEB_DIST: /app/public
    ports:
      - "${PORT:-4000}:4000"
    volumes:
      - atelierpro-backups:/app/backups

volumes:
  atelierpro-db:
  atelierpro-backups:
